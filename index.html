<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true">···</div>
      <div class="brand-copy"><p class="eyebrow">PHYSICS · VIRTUAL LAB</p><h1>打点计时器模拟实验</h1><p>研究匀变速直线运动</p></div>
      <button id="reset-top" class="text-button" type="button" hidden>重新开始实验</button>
    </div>
  </header>
  <main id="app" class="main-shell" aria-live="polite"></main>

  <dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">重新开始实验？</h2>
    <p>当前纸带、读数和计算结果将被清除，并生成新一轮实验。</p>
    <div class="button-row"><button id="cancel-reset" class="button ghost" type="button">继续当前实验</button><button id="confirm-reset" class="button danger" type="button">确认重新开始</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
'use strict';
const CONFIG = Object.freeze({
  storageKey: 'ticker-tape-lab-v1',
  frequencyHz: 50,
  intervalsPerCount: 5,
  countIntervals: 5,
  manualVelocityIndices: Object.freeze([1, 4]),
  accelerationMps2: 2.5,
  initialVelocityMps: 0.2,
  initialVelocityVariationMps: 0.02,
  readingDecimals: 2,
  readingToleranceCm: 0.05,
  speedDecimals: 3,
  speedToleranceMps: 0.02,
  accelerationDecimals: 3,
  accelerationToleranceMps2: 0.12,
  tapePixelsPerCm: 31,
});

const timedIntervalSeconds = (config = CONFIG) => 1 / config.frequencyHz;
const countIntervalSeconds = (config = CONFIG) => config.intervalsPerCount / config.frequencyHz;
const cmToM = cm => cm / 100;
const mToCm = m => m * 100;

// Display rounding is kept separate from the SI calculation model and saved inputs.
function formatNumber(value) {
  const fixed = Number(value).toFixed(2);
  return Number(fixed) === 0 ? '0.00' : fixed;
}


const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const validReading = raw => typeof raw === 'string' && /^\d+\.\d{2}$/.test(raw);
const validAnswer = raw => typeof raw === 'string' && raw.trim() !== '' && Number.isFinite(Number(raw)) && Number(raw) >= 0;
const validInternalIndex = (index, config) => Number.isInteger(index) && index >= 1 && index < config.countIntervals;

function makeMotion(random = Math.random, config = CONFIG, previousInitialVelocityMps = null) {
  const draw = Math.min(0.999999, Math.max(0, Number(random())));
  const choices = Array.from({ length: 5 }, (_, index) => round2(config.initialVelocityMps + (index - 2) * config.initialVelocityVariationMps / 2));
  const eligible = choices.filter(value => value !== previousInitialVelocityMps);
  return { initialVelocityMps: eligible[Math.floor(draw * eligible.length)], accelerationMps2: config.accelerationMps2 };
}

function positionAt(timeS, motion) {
  return motion.initialVelocityMps * timeS + 0.5 * motion.accelerationMps2 * timeS ** 2;
}

function makeDots(motion, config = CONFIG) {
  const last = config.countIntervals * config.intervalsPerCount;
  return Array.from({ length: last + 1 }, (_, index) => {
    const timeS = index * timedIntervalSeconds(config);
    return { index, timeS, positionM: positionAt(timeS, motion), countIndex: index % config.intervalsPerCount === 0 ? index / config.intervalsPerCount : null };
  });
}

function createRound(random = Math.random, config = CONFIG, previousInitialVelocityMps = null) {
  return {
    version: 2,
    runId: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.floor(random() * 1e8)}`,
    motion: makeMotion(random, config, previousInitialVelocityMps),
    stage: 'home', phase: 'measure', powerOn: false, released: false,
    showTimedDots: false, tapeMode: 'cumulative', selectedIndex: 1,
    readingDrafts: {}, readingCheck: null, readings: { 0: '0.00' },
    speedDrafts: {}, accelerationMethod: 'difference', graphSelection: [], accelerationDraft: '',
    submittedAt: null,
  };
}

function referenceDistancesCm(round, config = CONFIG) {
  const dots = makeDots(round.motion, config);
  return Array.from({ length: config.countIntervals + 1 }, (_, i) => mToCm(dots[i * config.intervalsPerCount].positionM));
}

function allReadingsComplete(round, config = CONFIG) {
  return Array.from({ length: config.countIntervals + 1 }, (_, i) => validReading(round.readings[i])).every(Boolean);
}

function checkReading(raw, index, round, config = CONFIG) {
  if (!Number.isInteger(index) || index < 1 || index > config.countIntervals) return { ok: false, reason: '请选择有效的计数点。' };
  if (!validReading(raw) || Number(raw) < 0 || Number(raw) > referenceDistancesCm(round, config).at(-1) + 10) {
    return { ok: false, reason: '请输入非负的厘米读数，保留两位小数。' };
  }
  const expected = referenceDistancesCm(round, config)[index];
  if (Math.abs(Number(raw) - expected) > config.readingToleranceCm + 1e-9) {
    return { ok: false, reason: '读数不在合理范围内，请重新观察纸带和刻度。' };
  }
  return { ok: true, reason: '读数已通过检查，请确认保存。' };
}

function derive(round, config = CONFIG) {
  if (!allReadingsComplete(round, config)) return null;
  const distancesCm = Array.from({ length: config.countIntervals + 1 }, (_, i) => Number(round.readings[i]));
  const displacementsCm = distancesCm.slice(1).map((x, i) => round2(x - distancesCm[i]));
  const T = countIntervalSeconds(config);
  const velocitiesMps = Array.from({ length: config.countIntervals - 1 }, (_, j) => {
    const i = j + 1;
    return cmToM(distancesCm[i + 1] - distancesCm[i - 1]) / (2 * T);
  });
  // Five equal intervals: pair displacements two intervals apart.
  // Each difference equals 2 a T², so the three pairs sum to 6 a T².
  const differenceAccelerationMps2 = config.countIntervals === 5
    ? cmToM((displacementsCm[2] - displacementsCm[0]) + (displacementsCm[3] - displacementsCm[1]) + (displacementsCm[4] - displacementsCm[2])) / (6 * T * T)
    : null;
  return { distancesCm, displacementsCm, velocitiesMps, differenceAccelerationMps2 };
}

function graphAcceleration(data, pair, config = CONFIG) {
  if (!data || !Array.isArray(pair) || pair.length !== 2) return null;
  const [first, second] = pair.map(Number);
  if (!validInternalIndex(first, config) || !validInternalIndex(second, config) || first === second) return null;
  return (data.velocitiesMps[second - 1] - data.velocitiesMps[first - 1]) / ((second - first) * countIntervalSeconds(config));
}

function manualVelocitiesComplete(round, config = CONFIG) {
  return config.manualVelocityIndices.every(index => validInternalIndex(index, config) && validAnswer(round.speedDrafts[index]));
}

function analysisVelocities(round, data = derive(round), config = CONFIG) {
  if (!data || !manualVelocitiesComplete(round, config)) return null;
  return data.velocitiesMps.map((reference, j) => {
    const index = j + 1;
    return config.manualVelocityIndices.includes(index) ? Number(round.speedDrafts[index]) : reference;
  });
}

function selectedGraphAcceleration(round, data = derive(round), config = CONFIG) {
  const velocitiesMps = analysisVelocities(round, data, config);
  return velocitiesMps ? graphAcceleration({ velocitiesMps }, round.graphSelection, config) : null;
}

function invalidateCalculations(next) {
  next.phase = 'measure';
  next.stage = 'analysis';
  next.tapeMode = 'cumulative';
  next.speedDrafts = {};
  next.graphSelection = [];
  next.accelerationDraft = '';
  next.submittedAt = null;
}

function reduceRound(round, action, config = CONFIG) {
  const next = structuredClone(round);
  const needTape = () => { if (!next.released || next.stage === 'home' || next.stage === 'setup') throw new Error('请先接通电源并释放小车，生成纸带。'); };
  switch (action.type) {
    case 'START':
      if (next.stage !== 'home') throw new Error('实验已经开始。');
      next.stage = 'setup'; break;
    case 'POWER_ON':
      if (next.stage !== 'setup') throw new Error('请先开始实验。');
      next.powerOn = true; break;
    case 'RELEASE':
      if (next.stage !== 'setup' || !next.powerOn) throw new Error('请先接通打点计时器电源。');
      next.released = true; next.stage = 'analysis'; break;
    case 'TOGGLE_TIMED':
      needTape(); next.showTimedDots = !next.showTimedDots; break;
    case 'SELECT_POINT':
      needTape();
      if (!Number.isInteger(action.index) || action.index < 1 || action.index > config.countIntervals) throw new Error('计数点无效。');
      next.selectedIndex = action.index;
      next.readingDrafts[action.index] ??= next.readings[action.index] ?? '';
      next.readingCheck = null; break;
    case 'DRAFT_READING':
      needTape(); next.readingDrafts[next.selectedIndex] = String(action.raw); next.readingCheck = null; break;
    case 'CHECK_READING': {
      needTape();
      const raw = next.readingDrafts[next.selectedIndex] ?? '';
      const result = checkReading(raw, next.selectedIndex, next, config);
      next.readingCheck = { index: next.selectedIndex, raw, ...result };
      break;
    }
    case 'SAVE_READING': {
      needTape();
      const checked = next.readingCheck;
      if (!checked?.ok || checked.index !== next.selectedIndex || checked.raw !== next.readingDrafts[next.selectedIndex]) throw new Error('请先检查当前读数。');
      const old = next.readings[next.selectedIndex];
      next.readings[next.selectedIndex] = checked.raw;
      next.readingCheck = null;
      if (old !== checked.raw) invalidateCalculations(next);
      break;
    }
    case 'CLEAR_READING':
      needTape();
      if (!next.readings[action.index] || action.index === 0) throw new Error('该点没有可清除的读数。');
      delete next.readings[action.index];
      delete next.readingDrafts[action.index];
      next.readingCheck = null;
      invalidateCalculations(next); break;
    case 'CALCULATE_DISPLACEMENTS':
      needTape();
      if (!allReadingsComplete(next, config)) throw new Error('请先完成全部累计距离读数。');
      next.tapeMode = 'displacement'; next.phase = 'speed'; break;
    case 'RETURN_MEASURE':
      needTape(); next.phase = 'measure'; next.tapeMode = 'cumulative'; break;
    case 'RETURN_SPEED':
      needTape();
      if (!derive(next, config)) throw new Error('累计距离数据不足。');
      next.phase = 'speed'; next.graphSelection = []; next.accelerationDraft = ''; break;
    case 'SET_TAPE_MODE':
      needTape();
      if (!['cumulative', 'displacement'].includes(action.mode)) throw new Error('纸带模式无效。');
      if (action.mode === 'displacement' && !allReadingsComplete(next, config)) throw new Error('请先完成全部累计距离读数。');
      next.tapeMode = action.mode; break;
    case 'DRAFT_SPEED':
      needTape();
      if (!config.manualVelocityIndices.includes(action.index)) throw new Error('该计数点的速度由系统计算。');
      next.speedDrafts[action.index] = String(action.raw);
      next.graphSelection = [];
      next.accelerationDraft = '';
      if (next.phase === 'acceleration') next.phase = 'speed';
      break;
    case 'TO_ACCELERATION':
      needTape();
      if (!derive(next, config)) throw new Error('累计距离数据不足。');
      if (!manualVelocitiesComplete(next, config)) throw new Error('请先填写指定的两个计数点速度。');
      next.phase = 'acceleration'; break;
    case 'SET_METHOD':
      needTape();
      if (!['difference', 'graph'].includes(action.method)) throw new Error('计算方法无效。');
      next.accelerationMethod = action.method; next.accelerationDraft = ''; break;
    case 'SELECT_GRAPH_POINT':
      needTape();
      if (next.phase !== 'acceleration' || next.accelerationMethod !== 'graph' || !analysisVelocities(next, derive(next, config), config)) throw new Error('请先完成两个指定速度的计算。');
      if (!validInternalIndex(action.index, config)) throw new Error('请选择图像上的内部计数点。');
      if (next.graphSelection.length === 1 && next.graphSelection[0] === action.index) throw new Error('第二个点须位于不同的时刻。');
      next.graphSelection = next.graphSelection.length === 1 ? [next.graphSelection[0], action.index] : [action.index];
      break;
    case 'RESET_GRAPH_POINTS':
      needTape(); next.graphSelection = []; break;
    case 'DRAFT_ACCELERATION':
      needTape(); next.accelerationDraft = String(action.raw); break;
    case 'SUBMIT':
      needTape();
      if (next.phase !== 'acceleration' || !derive(next, config)) throw new Error('请先完成测量和速度计算。');
      if (!manualVelocitiesComplete(next, config)) throw new Error('请先填写指定的两个计数点速度。');
      if (next.accelerationMethod === 'difference' && !validAnswer(next.accelerationDraft)) throw new Error('请填写逐差法加速度计算结果。');
      if (next.accelerationMethod === 'graph' && selectedGraphAcceleration(next, derive(next, config), config) === null) throw new Error('请在图像上选择两个不同时刻的数据点。');
      next.stage = 'results'; next.submittedAt = new Date().toISOString(); break;
    case 'EDIT_RESULTS':
      if (next.stage !== 'results') throw new Error('结果尚未提交。');
      next.stage = 'analysis'; next.phase = 'acceleration'; next.submittedAt = null; break;
    default: throw new Error('未知操作。');
  }
  return next;
}

function resultsFor(round, config = CONFIG) {
  if (round.stage !== 'results') return null;
  const data = derive(round, config);
  if (!data) return null;
  const referenceCm = referenceDistancesCm(round, config);
  const measuredAcceleration = round.accelerationMethod === 'difference' ? data.differenceAccelerationMps2 : graphAcceleration(data, round.graphSelection, config);
  const studentAcceleration = round.accelerationMethod === 'difference' ? Number(round.accelerationDraft) : selectedGraphAcceleration(round, data, config);
  if (measuredAcceleration === null || studentAcceleration === null) return null;
  return {
    data, referenceCm, measuredAcceleration, studentAcceleration,
    analysisVelocitiesMps: analysisVelocities(round, data, config),
    measurementErrorsCm: data.distancesCm.map((value, i) => value - referenceCm[i]),
    velocityErrorsMps: data.velocitiesMps.map((value, i) => config.manualVelocityIndices.includes(i + 1) ? Number(round.speedDrafts[i + 1]) - value : null),
    processingErrorMps2: studentAcceleration - measuredAcceleration,
    measurementEffectMps2: measuredAcceleration - round.motion.accelerationMps2,
    totalErrorMps2: studentAcceleration - round.motion.accelerationMps2,
  };
}

function restoreRound(raw, config = CONFIG) {
  if (!raw) return null;
  try {
    const value = JSON.parse(raw);
    if (![1,2].includes(value.version) || !['home','setup','analysis','results'].includes(value.stage) ||
      !['measure','speed','acceleration'].includes(value.phase) ||
      !['cumulative','displacement'].includes(value.tapeMode) ||
      !Number.isFinite(value.motion?.initialVelocityMps) || !Number.isFinite(value.motion?.accelerationMps2) ||
      value.motion.initialVelocityMps < 0 || value.motion.accelerationMps2 !== config.accelerationMps2 ||
      !value.readings || value.readings[0] !== '0.00' || !value.readingDrafts || !value.speedDrafts ||
      !Number.isInteger(value.selectedIndex) || value.selectedIndex < 1 || value.selectedIndex > config.countIntervals ||
      typeof value.powerOn !== 'boolean' || typeof value.released !== 'boolean' || typeof value.showTimedDots !== 'boolean' ||
      (value.released && !value.powerOn) || (value.stage === 'results' && !allReadingsComplete(value, config))) return null;
    if (value.version === 1) {
      value.version = 2;
      value.speedDrafts = Object.fromEntries(config.manualVelocityIndices.filter(index => value.speedDrafts[index] !== undefined).map(index => [index, value.speedDrafts[index]]));
      value.graphSelection = [];
      if (value.stage === 'results' && value.accelerationMethod === 'graph') {
        value.stage = 'analysis';
        value.phase = 'acceleration';
        value.submittedAt = null;
      }
      delete value.graphPair;
    }
    if (!Array.isArray(value.graphSelection) || value.graphSelection.length > 2 || !value.graphSelection.every(index => validInternalIndex(index, config)) ||
      (value.graphSelection.length === 2 && value.graphSelection[0] === value.graphSelection[1])) return null;
    return value;
  } catch { return null; }
}


const app = document.querySelector('#app');
const resetTop = document.querySelector('#reset-top');
const resetDialog = document.querySelector('#reset-dialog');
const toast = document.querySelector('#toast');
let savedRound = null;
let storageAvailable = true;
try { savedRound = localStorage.getItem(CONFIG.storageKey); } catch { storageAvailable = false; }
let round = restoreRound(savedRound) ?? createRound();
let toastTimer;

const e = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
const n = (value, digits = 2) => {
  if (digits === 2) return formatNumber(value);
  const fixed = Number(value).toFixed(digits);
  return Number(fixed) === 0 ? (0).toFixed(digits) : fixed;
};
const persist = () => {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(round)); }
  catch { storageAvailable = false; }
};
const disabled = condition => condition ? 'disabled' : '';
const button = (label, action, style = 'primary', extra = '') => `<button class="button ${style}" type="button" data-action="${action}" ${extra}>${label}</button>`;

function flash(message) {
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
}

function dispatch(action, scrollToSelected = false) {
  try {
    round = reduceRound(round, action);
    persist();
    render(scrollToSelected);
  } catch (error) { render(); flash(error.message); }
}

function bracket(x1, x2, y, label, color, id) {
  return `<g data-bracket="${id}"><path d="M${n(x1,1)} ${y-15} Q${n(x1,1)} ${y} ${n(x1+10,1)} ${y} H${n(x2-10,1)} Q${n(x2,1)} ${y} ${n(x2,1)} ${y-15}" fill="none" stroke="${color}" stroke-width="2.5"/><text x="${n(x2+10,1)}" y="${y+4}" fill="${color}" font-size="15" font-weight="750">${e(label)}</text></g>`;
}

function renderTape() {
  const dots = makeDots(round.motion);
  const refs = referenceDistancesCm(round);
  const data = derive(round);
  const scale = CONFIG.tapePixelsPerCm;
  const left = 74;
  const x = cm => left + cm * scale;
  const maxCm = Math.ceil(refs.at(-1) + 1);
  const width = Math.ceil(x(maxCm) + 170);
  const cumulative = round.tapeMode === 'cumulative';
  const height = cumulative ? 475 : 300;
  const ticks = Array.from({ length: maxCm + 1 }, (_, cm) => `<line x1="${x(cm)}" y1="160" x2="${x(cm)}" y2="${cm % 5 === 0 ? 184 : 174}" stroke="#526e7e" stroke-width="${cm % 5 === 0 ? 2 : 1}"/>${cm % 2 === 0 ? `<text x="${x(cm)}" y="199" text-anchor="middle" fill="#405b6d" font-size="12">${cm}</text>` : ''}`).join('');
  const timedDots = round.showTimedDots ? dots.filter(dot => dot.countIndex === null).map(dot => `<circle cx="${n(x(mToCm(dot.positionM)),2)}" cy="116" r="3" fill="#879da8"/>`).join('') : '';
  const countDots = dots.filter(dot => dot.countIndex !== null).map(dot => {
    const index = dot.countIndex;
    const cx = x(mToCm(dot.positionM));
    return `<g class="count-point" data-action="select-point" data-index="${index}" role="button" tabindex="0" aria-label="计数点 ${index}">${index === round.selectedIndex && round.stage === 'analysis' ? `<circle cx="${n(cx,2)}" cy="116" r="14" fill="none" stroke="#0d81c5" stroke-width="2"/>` : ''}<circle cx="${n(cx,2)}" cy="116" r="7" fill="#168dcd" stroke="#e6faff" stroke-width="2"/><circle cx="${n(cx,2)}" cy="116" r="17" fill="transparent"/><text x="${n(cx,2)}" y="71" text-anchor="middle" fill="#d9f4ff" font-size="16" font-weight="800">${index}</text></g>`;
  }).join('');
  let marks = '';
  if (cumulative) {
    for (let i = 1; i <= CONFIG.countIntervals; i++) {
      if (round.readings[i]) marks += bracket(x(0), x(refs[i]), 224 + (i - 1) * 43, `x${i}  ${round.readings[i]} cm`, '#38b6dd', `x${i}`);
    }
    if (!round.readings[round.selectedIndex]) marks += `<g><path d="M${x(0)} 447 H${n(x(refs[round.selectedIndex]),1)}" stroke="#d39438" stroke-width="2" stroke-dasharray="6 6"/><text x="${n(x(refs[round.selectedIndex])+9,1)}" y="452" fill="#a16416" font-size="13">当前测量：0 → ${round.selectedIndex}</text></g>`;
  } else if (data) {
    for (let i = 1; i <= CONFIG.countIntervals; i++) marks += bracket(x(refs[i-1]), x(refs[i]), 227 + (i % 2) * 37, `s${i}  ${n(data.displacementsCm[i-1])} cm`, '#1685b1', `s${i}`);
  }
  return `<section class="card tape-card"><div class="section-heading"><div><p class="eyebrow">TICKER TAPE / 实验纸带</p><h2>${cumulative ? '累计距离' : '相邻计数点位移'}</h2></div><div class="tape-controls">${allReadingsComplete(round) && round.phase !== 'measure' ? `<div class="segmented" role="group" aria-label="纸带显示模式"><button type="button" data-action="mode-cumulative" aria-pressed="${cumulative}">累计距离</button><button type="button" data-action="mode-displacement" aria-pressed="${!cumulative}">相邻位移</button></div>` : ''}${button(round.showTimedDots ? '隐藏计时点' : '显示隐藏计时点','toggle-timed','ghost')}</div></div><p class="tape-caption">每隔 ${CONFIG.intervalsPerCount} 个计时点间隔选取一个计数点，计数点间隔 ΔT = ${n(countIntervalSeconds())} s。左右滑动纸带查看全段。</p><div class="tape-scroll"><svg class="tape-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="带有真实运动点位、厘米刻度和${cumulative ? '累计距离' : '相邻位移'}括号的纸带"><rect x="35" y="87" width="${width-70}" height="118" rx="8" fill="#e7f3f8"/><rect x="35" y="87" width="${width-70}" height="62" rx="8" fill="#f5fbfd"/><line x1="35" y1="151" x2="${width-35}" y2="151" stroke="#b0cbd4"/><text x="${left}" y="38" fill="#d9f4ff" font-size="15" font-weight="800">起始计数点 0</text><text x="${width-115}" y="199" fill="#405b6d" font-size="12">刻度 / cm</text>${ticks}${timedDots}${countDots}${marks}</svg></div><div class="tape-legend"><span><i class="legend-dot count"></i>计数点</span><span><i class="legend-dot timed"></i>${round.showTimedDots ? '中间计时点（已显示）' : '中间计时点（已隐藏）'}</span></div><p class="tape-help">括号的两端对准纸带上的计数点；切换计时点显示不会改变点位和数据。</p></section>`;
}

function renderZoom(index) {
  const exact = referenceDistancesCm(round)[index];
  const start = Math.floor((exact - 0.6) * 10) / 10;
  const sx = cm => 55 + (cm - start) * 325;
  const ticks = Array.from({ length: 13 }, (_, j) => {
    const cm = Math.round((start + j * 0.1) * 10) / 10;
    const major = j % 2 === 0;
    return `<line x1="${n(sx(cm),1)}" y1="67" x2="${n(sx(cm),1)}" y2="${major ? 95 : 84}" stroke="#476678" stroke-width="${major ? 2 : 1}"/>${major ? `<text x="${n(sx(cm),1)}" y="115" text-anchor="middle" fill="#23435a" font-size="12">${n(cm,1)}</text>` : ''}`;
  }).join('');
  return `<div class="zoom-card"><h3>计数点 ${index} · 局部放大刻度</h3><div class="zoom-scroll" data-dot-x="${n(sx(exact),2)}"><svg viewBox="0 0 500 135" role="img" aria-label="计数点 ${index} 附近的放大厘米刻度尺"><rect width="500" height="135" rx="8" fill="#edf6f9"/><line x1="35" y1="67" x2="465" y2="67" stroke="#476678" stroke-width="2"/>${ticks}<circle cx="${n(sx(exact),2)}" cy="39" r="7" fill="#168dcd"/><path d="M${n(sx(exact),2)} 47V66" stroke="#168dcd" stroke-width="2"/></svg></div><p>蓝点向下对准厘米刻度，按 0.01 cm 估读；窄屏可左右滑动刻度。</p></div>`;
}

function renderMeasure() {
  const i = round.selectedIndex;

  return `<section class="card" id="measure-section"><div class="section-heading"><div><p class="eyebrow">01 / MEASUREMENT</p><h2>测量累计距离</h2><p class="muted small">从起始点 0 测到所选计数点。0 点为 0.00 cm，已固定记录。已确认 ${count}/${CONFIG.countIntervals} 个。</p></div><span class="status-pill">${count === CONFIG.countIntervals ? '测量完成' : '测量进行中'}</span></div><div class="point-grid">${points}</div><div class="measure-layout"><div><label class="field-label" for="reading-input">计数点 ${i} 到 0 点的累计距离</label><div class="input-row"><input id="reading-input" class="number-input" type="text" inputmode="decimal" autocomplete="off" placeholder="输入读数，保留两位小数" value="${e(round.readingDrafts[i] ?? round.readings[i] ?? '')}" aria-describedby="reading-feedback"><span class="unit">cm</span></div>${feedback}<div class="button-row">${button('检查读数','check-reading','secondary')}${button('确认保存','save-reading','primary',disabled(!check?.ok || check.index !== i))}${round.readings[i] ? button('清除此读数','clear-reading','ghost') : ''}</div><div class="record-list">${Array.from({ length: CONFIG.countIntervals }, (_, j) => `<div class="record-item"><span>0 → ${j+1}</span><span class="${round.readings[j+1] ? '' : 'empty'}">${round.readings[j+1] ? `<strong>${e(round.readings[j+1])} cm · 已确认</strong>` : '未填写'}</span></div>`).join('')}</div>${count === CONFIG.countIntervals ? `<div class="button-row">${button('计算相邻点位移 →','calculate-displacements')}</div>` : ''}</div>${renderZoom(i)}</div></section>`;
}

function renderSpeed() {
  const data = derive(round);
  if (!data) return `<section class="card"><p>请先完成累计距离测量。</p></section>`;
  const rows = data.velocitiesMps.map((value, j) => {
    const i = j + 1;
    const manual = CONFIG.manualVelocityIndices.includes(i);
    return `<tr><td>计数点 ${i}</td><td>${n(i * countIntervalSeconds())} s</td><td>x${i-1} 与 x${i+1}</td><td><span class="source-tag ${manual ? 'student' : 'automatic'}">${manual ? '学生填写' : '系统计算'}</span></td><td>${manual ? `<input class="number-input" data-speed-index="${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="自行计算" value="${e(round.speedDrafts[i] ?? '')}" aria-label="计数点 ${i} 的瞬时速度，米每秒">` : `<strong class="auto-value">${formatNumber(value)} m/s</strong>`}</td></tr>`;
  }).join('');
  return `<section class="card"><p class="eyebrow">02 / VELOCITY</p><h2>计算两个指定点的瞬时速度</h2><p class="muted">只需手动计算计数点 ${CONFIG.manualVelocityIndices.join(' 和 ')}；其余内部计数点速度由本轮已确认的纸带读数自动计算。端点 0 和 ${CONFIG.countIntervals} 不计算速度。</p><p class="formula">v<sub>i</sub> ≈ (x<sub>i+1</sub> − x<sub>i−1</sub>) ÷ (2ΔT)，ΔT = ${n(countIntervalSeconds())} s。纸带读数为 cm，计算速度时先换算为 m。</p><div class="data-table-wrap"><table class="data-table"><thead><tr><th>速度位置</th><th>时刻</th><th>取点</th><th>数据来源</th><th>速度 / m·s⁻¹</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small muted">图像法使用你填写的两个速度和系统计算的其余速度。修改输入后，图像选点与结果会更新。</p><div class="button-row">${button('返回修改累计距离','return-measure','ghost')}${button('进入加速度计算 →','to-acceleration')}</div></section>`;
}

function renderGraph(data) {
  const values = analysisVelocities(round, data);
  if (!values) return '';
  const ymax = Math.ceil((Math.max(...values) + 0.1) * 10) / 10;
  const x = i => 70 + (i - 1) * 140;
  const y = v => 255 - v / ymax * 205;
  const grid = Array.from({ length: 6 }, (_, j) => {
    const value = ymax * j / 5;
    return `<line x1="70" y1="${n(y(value),1)}" x2="505" y2="${n(y(value),1)}" stroke="#31516a" stroke-dasharray="4 5"/><text x="60" y="${n(y(value)+4,1)}" text-anchor="end" fill="#9bbaca" font-size="11">${n(value,2)}</text>`;
  }).join('');
  const rawLine = values.map((value,j) => `${x(j+1)},${n(y(value),1)}`).join(' ');
  const selection = round.graphSelection;
  const selectedLine = selection.length === 2 ? `<line x1="${x(selection[0])}" y1="${n(y(values[selection[0]-1]),1)}" x2="${x(selection[1])}" y2="${n(y(values[selection[1]-1]),1)}" stroke="#ffcf7b" stroke-width="3"/>` : '';
  const points = values.map((value, j) => {
    const index = j + 1;
    const selectedPosition = selection.indexOf(index);
    return `<g data-action="graph-point" data-index="${index}" role="button" tabindex="0" aria-label="选择计数点 ${index}，t=${n(index*countIntervalSeconds())}秒，v=${n(value)}米每秒"><circle cx="${x(index)}" cy="${n(y(value),1)}" r="27" fill="transparent"/>${selectedPosition >= 0 ? `<circle cx="${x(index)}" cy="${n(y(value),1)}" r="16" fill="none" stroke="${selectedPosition === 0 ? '#ffcf7b' : '#80e7a7'}" stroke-width="3"/><text x="${x(index)+18}" y="${n(y(value)-17,1)}" fill="${selectedPosition === 0 ? '#ffcf7b' : '#80e7a7'}" font-size="17" font-weight="800">${selectedPosition === 0 ? 'A' : 'B'}</text>` : ''}<circle cx="${x(index)}" cy="${n(y(value),1)}" r="7" fill="${CONFIG.manualVelocityIndices.includes(index) ? '#62dfdf' : '#5aaaff'}" stroke="#082034" stroke-width="2"/><text x="${x(index)}" y="${n(y(value)-13,1)}" text-anchor="middle" fill="#d9f5ff" font-size="13" font-weight="700">${index}</text><text x="${x(index)}" y="280" text-anchor="middle" fill="#a9c7d5" font-size="12">${n(index*countIntervalSeconds())}</text></g>`;
  }).join('');
  return `<svg id="velocity-graph" class="graph-svg" data-action="graph-plot" viewBox="0 0 580 315" role="img" aria-label="点击速度时间图像，吸附选择内部计数点"><text x="19" y="22" fill="#d3eaf5" font-size="13">v / (m·s⁻¹)</text><path d="M70 35V255H520" fill="none" stroke="#a9d4e4" stroke-width="2"/>${grid}<polyline points="${rawLine}" fill="none" stroke="#4b829e" stroke-width="2" stroke-dasharray="5 5"/>${selectedLine}${points}<text x="515" y="286" fill="#d3eaf5" font-size="13">t / s</text></svg>`;
}

function renderAcceleration() {
  const data = derive(round);
  if (!data) return `<section class="card"><p>请先完成累计距离测量。</p></section>`;
  const difference = round.accelerationMethod === 'difference';
  const values = analysisVelocities(round, data);
  const selection = round.graphSelection;
  const selectedPoint = (index, label) => index === undefined ? `<div class="selected-point empty">${label}：等待选点</div>` : `<div class="selected-point"><strong>${label} · 计数点 ${index}</strong><span>t = ${n(index*countIntervalSeconds())} s</span><span>v = ${n(values[index-1])} m/s</span></div>`;
  const slope = selectedGraphAcceleration(round, data);
  const graphPanel = `<div class="method-panel"><p class="formula">直接点击图中的原始实验数据点，或点击附近位置自动吸附。折线只连接数据点，并非拟合直线。先选 A，再选不同时刻的 B。</p><div class="graph-scroll">${renderGraph(data)}</div><div class="selected-points">${selectedPoint(selection[0], 'A')}${selectedPoint(selection[1], 'B')}</div>${slope === null ? `<p class="feedback">${selection.length === 1 ? '已选 A，请点击另一个时刻的点。' : '请选择两个不同时刻的点。'}</p>` : `<p class="formula graph-answer">a = (v<sub>B</sub> − v<sub>A</sub>) ÷ (t<sub>B</sub> − t<sub>A</sub>) = ${n(slope)} m/s²</p>`}<div class="button-row">${button('重新选点','reset-graph','ghost')}</div><p class="small muted">青色点为学生填写的速度，蓝色点为系统按本轮纸带计算的速度；窄屏可左右滑动图像。</p></div>`;
  return `<section class="card"><p class="eyebrow">03 / ACCELERATION</p><h2>计算加速度</h2><p class="muted">可用逐差法自行计算，也可在 v–t 图像上选两点自动求斜率。</p><div class="segmented" role="group" aria-label="加速度计算方法"><button type="button" data-action="method-difference" aria-pressed="${difference}">逐差法</button><button type="button" data-action="method-graph" aria-pressed="${!difference}">v–t 图像法</button></div>${difference ? `<div class="method-panel"><p class="formula">本轮有 5 段等时间隔位移：a ≈ [(s₃−s₁)+(s₄−s₂)+(s₅−s₃)] ÷ (6ΔT²)。请将 s 的 cm 换算为 m，ΔT = ${n(countIntervalSeconds())} s。</p><p class="muted small">该公式使用跨 2 段的三组逐差，适用于当前 5 段纸带。</p><div class="button-row"><label class="field-label" for="acceleration-input">你的加速度 / m·s⁻²</label><input id="acceleration-input" class="number-input" style="max-width:210px" type="text" inputmode="decimal" autocomplete="off" placeholder="自行计算" value="${e(round.accelerationDraft)}"></div></div>` : graphPanel}<div class="button-row">${button('返回修改速度','return-speed','ghost')}${button('返回修改累计距离','return-measure','ghost')}${button('提交实验结果 →','submit')}</div></section>`;
}

function renderAnalysis() {
  const phase = round.phase;
  const stageLabel = phase === 'measure' ? '累计距离测量' : phase === 'speed' ? '瞬时速度计算' : '加速度计算';
  return `<ol class="stepper"><li class="done">01 开始实验</li><li class="done">02 装置操作</li><li class="active">03 ${stageLabel}</li><li>04 结果反馈</li></ol><section class="card"><div class="section-heading"><div><p class="eyebrow">STATUS / 纸带已生成</p><h2>小车已释放，开始分析纸带</h2><p class="muted small">电源已接通 · 小车已释放 · ${makeDots(round.motion).length} 个计时点已生成（含计数点）</p></div><span class="status-pill">${stageLabel}</span></div></section>${renderTape()}${phase === 'measure' ? renderMeasure() : phase === 'speed' ? renderSpeed() : renderAcceleration()}`;
}

function renderResults() {
  const result = resultsFor(round);
  if (!result) return '<section class="card"><p>结果数据不完整，请重新开始实验。</p></section>';
  const { data, referenceCm, measurementErrorsCm, velocityErrorsMps } = result;
  const f = formatNumber;
  const a = round.motion.accelerationMps2;
  const good = Math.abs(result.processingErrorMps2) <= CONFIG.accelerationToleranceMps2;
  const maxReadingError = Math.max(...measurementErrorsCm.map(Math.abs));
  const speedWrong = velocityErrorsMps.filter(v => v !== null && Math.abs(v) > CONFIG.speedToleranceMps).length;
  const readingNote = maxReadingError < 0.005 ? '累计距离与纸带参考位置一致。' : `累计距离最大读数偏差为 ${f(maxReadingError)} cm；读数偏差会传递到位移、速度和加速度。`;
  const speedNote = speedWrong === 0 ? '两个手动速度与已确认读数对应的结果一致。' : `有 ${speedWrong} 个手动速度与已确认读数不符，请检查 0.10 s 计数点间隔及 cm→m 换算。`;
  const processingNote = good ? '加速度结果与本轮读数推得的值接近。' : round.accelerationMethod === 'graph' ? `图像选点斜率与纯读数参考斜率相差 ${f(Math.abs(result.processingErrorMps2))} m/s²；请检查手动计算的速度。` : `你的加速度与读数推得的值相差 ${f(Math.abs(result.processingErrorMps2))} m/s²；请检查逐差公式和单位换算。`;
  const unitsHint = Math.abs(result.studentAcceleration / result.measuredAcceleration - 100) < 10 || Math.abs(result.studentAcceleration / result.measuredAcceleration - .01) < .005 ? '结果接近 100 倍或 1/100 倍关系，请重点核对 cm 与 m 的换算。' : '';
  const rows = data.distancesCm.map((value, i) => `<tr><td>${i}</td><td>${f(i*countIntervalSeconds())}</td><td>${f(value)}</td><td>${f(referenceCm[i])}</td><td>${f(measurementErrorsCm[i])}</td></tr>`).join('');
  const velocityRows = data.velocitiesMps.map((value, j) => {
    const index = j + 1;
    const manual = CONFIG.manualVelocityIndices.includes(index);
    return `<tr><td>${index}</td><td>${f(index*countIntervalSeconds())}</td><td>${manual ? '学生填写' : '系统计算'}</td><td>${f(result.analysisVelocitiesMps[j])}</td><td>(${f(data.distancesCm[j+2])} − ${f(data.distancesCm[j])}) ÷ 100 ÷ ${f(2*countIntervalSeconds())} = ${f(value)}</td><td>${manual ? f(velocityErrorsMps[j]) : '—'}</td></tr>`;
  }).join('');
  const method = round.accelerationMethod === 'difference' ? '逐差法' : 'v–t 图像法';
  const formula = round.accelerationMethod === 'difference'
    ? `a = [(${f(data.displacementsCm[2])}−${f(data.displacementsCm[0])})+(${f(data.displacementsCm[3])}−${f(data.displacementsCm[1])})+(${f(data.displacementsCm[4])}−${f(data.displacementsCm[2])})] ÷ 100 ÷ (6×${f(countIntervalSeconds())}²) = ${f(result.measuredAcceleration)} m/s²`
    : `a = (${f(result.analysisVelocitiesMps[round.graphSelection[1]-1])}−${f(result.analysisVelocitiesMps[round.graphSelection[0]-1])}) ÷ (${f(round.graphSelection[1]*countIntervalSeconds())}−${f(round.graphSelection[0]*countIntervalSeconds())}) = ${f(result.studentAcceleration)} m/s²`;
  const graphCoordinates = round.accelerationMethod === 'graph' ? `<p class="small muted">选点 A：t = ${f(round.graphSelection[0]*countIntervalSeconds())} s，v = ${f(result.analysisVelocitiesMps[round.graphSelection[0]-1])} m/s；选点 B：t = ${f(round.graphSelection[1]*countIntervalSeconds())} s，v = ${f(result.analysisVelocitiesMps[round.graphSelection[1]-1])} m/s。</p>` : '';
  return `<ol class="stepper"><li class="done">01 开始实验</li><li class="done">02 装置操作</li><li class="done">03 纸带分析</li><li class="active">04 结果反馈</li></ol>
    <section class="card"><p class="eyebrow">LAB REPORT / 实验结果</p><div class="section-heading"><div><h2>本轮纸带分析报告</h2><p class="muted">处理结果来自本轮已确认的纸带读数；两个手动速度仍保留学生的原始输入。</p></div><span class="result-badge ${good && speedWrong === 0 ? '' : 'review'}">${good && speedWrong === 0 ? '计算基本一致' : '建议检查计算'}</span></div>
      <div class="result-grid"><div class="metric"><span class="label">理论加速度</span><strong>${f(a)} m/s²</strong></div><div class="metric"><span class="label">由纸带读数推得 · ${method}</span><strong>${f(result.measuredAcceleration)} m/s²</strong></div><div class="metric"><span class="label">${round.accelerationMethod === 'graph' ? '图像选点自动计算' : '你的结果'}</span><strong>${f(result.studentAcceleration)} m/s²</strong></div></div>
      <p class="formula">${formula}<br>结果 − 读数推得值 = ${f(result.processingErrorMps2)} m/s²；读数推得值 − 理论值 = ${f(result.measurementEffectMps2)} m/s²；结果 − 理论值 = ${f(result.totalErrorMps2)} m/s²。</p>${graphCoordinates}</section>
    <section class="card"><h2>累计距离记录与测量偏差</h2><div class="data-table-wrap"><table class="data-table"><thead><tr><th>计数点</th><th>时刻 / s</th><th>你的读数 / cm</th><th>参考位置 / cm</th><th>读数偏差 / cm</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="card"><h2>相邻位移</h2><div class="data-table-wrap"><table class="data-table"><thead><tr>${data.displacementsCm.map((_,i) => `<th>s${i+1}</th>`).join('')}</tr></thead><tbody><tr>${data.displacementsCm.map((v,i) => `<td>${f(data.distancesCm[i+1])}−${f(data.distancesCm[i])} = ${f(v)} cm</td>`).join('')}</tr></tbody></table></div><p class="small muted">由相邻两个已确认的累计距离作差：sᵢ = xᵢ − xᵢ₋₁。</p></section>
    <section class="card"><h2>瞬时速度</h2><div class="data-table-wrap"><table class="data-table"><thead><tr><th>计数点</th><th>时刻 / s</th><th>来源</th><th>速度 / m·s⁻¹</th><th>纸带读数代入（cm→m） / m·s⁻¹</th><th>学生计算偏差 / m·s⁻¹</th></tr></thead><tbody>${velocityRows}</tbody></table></div><p class="small muted">内部计数点：vᵢ ≈ (xᵢ₊₁ − xᵢ₋₁) / (2ΔT)，ΔT = ${f(countIntervalSeconds())} s。</p></section>
    <section class="card"><h2>误差分析与改进</h2><ul class="note-list"><li>${readingNote}</li><li>${speedNote}</li><li>${processingNote}</li><li>本轮读数造成的加速度差异为 ${f(result.measurementEffectMps2)} m/s²；可放大刻度后复测，并在计算中保留足够有效数字。</li>${unitsHint ? `<li>${unitsHint}</li>` : ''}</ul><div class="button-row">${button('返回修订计算','edit-results','ghost')}${button('重新开始实验','request-reset','secondary')}</div></section>`;
}

function render(scrollToSelected = false) {
  document.querySelector('.site-footer').textContent = storageAvailable
    ? '纸带数据仅保存在本机浏览器中 · 50 Hz 交流电源模拟'
    : '浏览器未允许本地存储，本轮数据仅在当前页面保留 · 50 Hz 交流电源模拟';
  const oldScroll = app.querySelector('.tape-scroll')?.scrollLeft ?? 0;
  const oldGraphScroll = app.querySelector('.graph-scroll')?.scrollLeft ?? 0;
  app.innerHTML = round.stage === 'home' ? renderHome() : round.stage === 'setup' ? renderSetup() : round.stage === 'results' ? renderResults() : renderAnalysis();
  resetTop.hidden = round.stage === 'home';
  const tape = app.querySelector('.tape-scroll');
  if (tape) {
    tape.scrollLeft = oldScroll;
    if (scrollToSelected) {
      const x = 74 + referenceDistancesCm(round)[round.selectedIndex] * CONFIG.tapePixelsPerCm;
      tape.scrollLeft = Math.max(0, x - tape.clientWidth / 2);
    }
  }
  const zoom = app.querySelector('.zoom-scroll');
  if (zoom) zoom.scrollLeft = Math.max(0, Number(zoom.dataset.dotX) - zoom.clientWidth / 2);
  const graph = app.querySelector('.graph-scroll');
  if (graph) graph.scrollLeft = oldGraphScroll;
}

app.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const index = Number(target.dataset.index);
  if (action === 'graph-point') return dispatch({ type:'SELECT_GRAPH_POINT', index });
  if (action === 'graph-plot') {
    const graph = target.closest('svg');
    const bounds = graph.getBoundingClientRect();
    const graphX = (event.clientX - bounds.left) * 580 / bounds.width;
    const nearest = Math.min(CONFIG.countIntervals - 1, Math.max(1, Math.round((graphX - 70) / 140) + 1));
    return dispatch({ type:'SELECT_GRAPH_POINT', index:nearest });
  }
  if (action === 'select-point' && index === 0) return;
  if (action === 'request-reset') return resetDialog.showModal();
  const mapping = {
    start: { type:'START' }, power: { type:'POWER_ON' }, release: { type:'RELEASE' },
    'toggle-timed': { type:'TOGGLE_TIMED' }, 'select-point': { type:'SELECT_POINT', index },
    'check-reading': { type:'CHECK_READING' }, 'save-reading': { type:'SAVE_READING' },
    'clear-reading': { type:'CLEAR_READING', index:round.selectedIndex },
    'calculate-displacements': { type:'CALCULATE_DISPLACEMENTS' },
    'mode-cumulative': { type:'SET_TAPE_MODE', mode:'cumulative' },
    'mode-displacement': { type:'SET_TAPE_MODE', mode:'displacement' },
    'return-measure': { type:'RETURN_MEASURE' }, 'return-speed': { type:'RETURN_SPEED' },
    'to-acceleration': { type:'TO_ACCELERATION' },
    'method-difference': { type:'SET_METHOD', method:'difference' },
    'method-graph': { type:'SET_METHOD', method:'graph' },
    'reset-graph': { type:'RESET_GRAPH_POINTS' },
    submit: { type:'SUBMIT' }, 'edit-results': { type:'EDIT_RESULTS' },
  };
  if (mapping[action]) dispatch(mapping[action], action === 'select-point');
});

app.addEventListener('keydown', event => {
  const target = event.target.closest('svg [data-action="select-point"], svg [data-action="graph-point"]');
  if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); target.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
});

app.addEventListener('input', event => {
  const target = event.target;
  if (target.id === 'reading-input') {
    try {
      round = reduceRound(round, { type:'DRAFT_READING', raw:target.value });
      persist();
      const feedback = document.querySelector('#reading-feedback');
      feedback.textContent = '待检查：请核对刻度后点击“检查读数”。';
      feedback.className = 'feedback';
      const save = app.querySelector('[data-action="save-reading"]');
      if (save) save.disabled = true;
    } catch (error) { flash(error.message); }
  } else if (target.dataset.speedIndex) {
    try { round = reduceRound(round, { type:'DRAFT_SPEED', index:Number(target.dataset.speedIndex), raw:target.value }); persist(); }
    catch (error) { flash(error.message); }
  } else if (target.id === 'acceleration-input') {
    try { round = reduceRound(round, { type:'DRAFT_ACCELERATION', raw:target.value }); persist(); }
    catch (error) { flash(error.message); }
  }
});

resetTop.addEventListener('click', () => resetDialog.showModal());
document.querySelector('#cancel-reset').addEventListener('click', () => resetDialog.close());
document.querySelector('#confirm-reset').addEventListener('click', () => {
  round = createRound(Math.random, CONFIG, round.motion.initialVelocityMps);
  persist();
  resetDialog.close();
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
  flash('已开启新一轮实验。');
});

persist();
render();

})();
</script>
</body>
</html>
